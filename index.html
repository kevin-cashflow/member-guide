<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>회원번호 안내</title>
<style>
  :root{
    --bg:#0f1620;
    --card:#17212e;
    --line:#243141;
    --text:#eef3f8;
    --muted:#8fa2b8;
    --accent:#2dd4bf;
    --accent-press:#14b8a6;
    --warn:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 80% at 50% 0%, #1b2838 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    display:flex;justify-content:center;
    padding:24px 20px 40px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
  .head{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .head h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-0.02em}
  .head p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px 22px;min-height:186px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    text-align:center;
  }
  .placeholder{color:var(--muted);font-size:14px;line-height:1.6}
  .placeholder.warn{color:var(--warn)}
  .num{
    font-variant-numeric:tabular-nums;letter-spacing:0.04em;
    font-size:34px;font-weight:800;line-height:1.15;word-break:break-all;
  }
  .name{font-size:15px;color:var(--accent);font-weight:600;letter-spacing:0.02em}
  .meta{font-size:11px;color:var(--muted)}
  .btn{
    appearance:none;-webkit-appearance:none;border:0;border-radius:16px;
    background:var(--accent);color:#062a26;
    font-size:17px;font-weight:800;letter-spacing:-0.01em;
    padding:19px 20px;width:100%;cursor:pointer;
    transition:transform .06s ease, background .15s ease;
    font-family:inherit;touch-action:manipulation;
  }
  .btn:active{transform:scale(.985);background:var(--accent-press)}
  .btn[disabled]{opacity:.6;cursor:default}
  .copy{
    appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:12px;
    background:transparent;color:var(--text);font-size:13px;font-weight:600;
    padding:10px 16px;cursor:pointer;font-family:inherit;touch-action:manipulation;
  }
  .copy:active{background:#1f2b3a}
  .copy.done{color:var(--accent);border-color:rgba(45,212,191,.4)}
  footer{margin-top:auto;display:flex;flex-direction:column;gap:6px;
    font-size:11px;color:var(--muted);line-height:1.6;text-align:center}
  .timer{font-variant-numeric:tabular-nums;color:#b7c6d8}
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>회원번호 안내</h1>
    <p>회원번호 안내에 사전 동의한 분의 번호 중 한 개를 보여 드립니다.</p>
  </div>

  <section class="card" id="card" aria-live="polite">
    <div class="placeholder">아래 버튼을 눌러 주세요.</div>
  </section>

  <button class="btn" id="pick" type="button">회원번호 받기</button>

  <footer>
    <div class="timer" id="timer">&nbsp;</div>
    <div>사전 동의를 받은 회원의 정보만 한 번에 하나씩 안내되며, 첫 안내 기준 10시간마다 갱신됩니다.</div>
  </footer>
</main>

<script>
(() => {
  const card = document.getElementById('card');
  const timer = document.getElementById('timer');
  const btn = document.getElementById('pick');
  const RESET_MS = 10 * 60 * 60 * 1000;
  let nextReset = 0;
  let busy = false;

  function showPlaceholder(text, isWarn) {
    card.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'placeholder' + (isWarn ? ' warn' : '');
    div.textContent = text;
    card.appendChild(div);
  }

  function renderEntry(item) {
    card.innerHTML = '';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.name;
    card.appendChild(name);

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = item.abo;
    card.appendChild(num);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = '회원번호 · 사전 동의된 안내 번호';
    card.appendChild(meta);

    const copy = document.createElement('button');
    copy.className = 'copy';
    copy.type = 'button';
    copy.textContent = '번호 복사';
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(item.abo);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = item.abo;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e2) {}
        document.body.removeChild(ta);
      }
      copy.textContent = '복사됨';
      copy.classList.add('done');
      setTimeout(() => {
        copy.textContent = '번호 복사';
        copy.classList.remove('done');
      }, 1600);
    };
    card.appendChild(copy);
  }

  function tick() {
    if (!nextReset) { timer.innerHTML = '&nbsp;'; return; }
    const left = nextReset - Date.now();
    if (left <= 0) {
      timer.textContent = '다음 목록 갱신 준비 중';
      return;
    }
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    timer.textContent = `다음 목록 갱신까지 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  async function pick() {
    if (busy) return;
    busy = true;
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '불러오는 중…';
    try {
      const res = await fetch('/api/pick', {
        cache: 'no-store',
        headers: { 'Accept': 'application/json' }
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }

      if (!res.ok || !data || data.ok !== true || !data.abo) {
        showPlaceholder(
          (data && data.message) || '지금은 안내할 번호를 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.',
          true
        );
        return;
      }

      renderEntry(data);
      nextReset = Number(data.next_reset_at) || 0;
      if (!nextReset) nextReset = Date.now() + RESET_MS;
      tick();
    } catch (e) {
      showPlaceholder('네트워크 연결을 확인한 뒤 다시 시도해 주세요.', true);
    } finally {
      busy = false;
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  btn.addEventListener('click', pick);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
